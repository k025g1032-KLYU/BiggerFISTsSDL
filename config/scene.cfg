# Scene preview for BiggerFISTsSDL and MultiModelPreview. Paths are relative to assets/models.
# Each model needs a unique id, position, scale, rotation (degrees), and spin (degrees/second).
camera 0 0 -6

model Target/Target.obj
id target
position -1.6 0 0
scale 1
rotation 0 0
spin 0 20

model LfistTEST/LfistTEST.obj
id left_fist
position 1.6 0 0
scale 1
rotation 15 30
spin 0 -25
